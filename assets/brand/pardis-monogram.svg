<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="PARDIS monogram">
  <title>PARDIS</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBCFA6"/>
      <stop offset=".48" stop-color="#C9A17A"/>
      <stop offset="1" stop-color="#A07A55"/>
    </linearGradient>
  </defs>
  <!-- twin rings -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width=".7" opacity=".45"/>
  <!-- serif P (Didone) -->
  <text x="98" y="140" text-anchor="middle"
        font-family="'Bodoni Moda', Georgia, 'Times New Roman', serif"
        font-size="132" font-weight="500" fill="url(#gold)">P</text>
  <!-- spark motif -->
  <g fill="url(#gold)">
    <path d="M143 62 l2.4 6.6 6.6 2.4 -6.6 2.4 -2.4 6.6 -2.4 -6.6 -6.6 -2.4 6.6 -2.4 z"/>
  </g>
</svg>
