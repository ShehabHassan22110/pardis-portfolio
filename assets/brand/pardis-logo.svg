<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="PARDIS — Portfolio">
  <title>PARDIS</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBCFA6"/>
      <stop offset=".48" stop-color="#C9A17A"/>
      <stop offset="1" stop-color="#A07A55"/>
    </linearGradient>
  </defs>

  <!-- monogram ring + P -->
  <g transform="translate(450 92)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="63" fill="none" stroke="url(#gold)" stroke-width=".6" opacity=".45"/>
    <text x="-1" y="31" text-anchor="middle"
          font-family="'Bodoni Moda', Georgia, serif" font-size="102" font-weight="500" fill="url(#gold)">P</text>
    <path d="M33 -34 l1.9 5.3 5.3 1.9 -5.3 1.9 -1.9 5.3 -1.9 -5.3 -5.3 -1.9 5.3 -1.9 z" fill="url(#gold)"/>
  </g>

  <!-- wordmark -->
  <text x="450" y="248" text-anchor="middle"
        font-family="'Bodoni Moda', Georgia, serif" font-size="96" font-weight="500"
        letter-spacing="14" fill="url(#gold)">PARDIS</text>

  <!-- divider · label · arabic -->
  <g fill="url(#gold)" opacity=".85">
    <rect x="300" y="286" width="70" height="1"/>
    <path d="M385 281 l1.6 4.5 4.5 1.6 -4.5 1.6 -1.6 4.5 -1.6 -4.5 -4.5 -1.6 4.5 -1.6 z"/>
    <rect x="405" y="286" width="70" height="1"/>
  </g>
  <text x="450" y="315" text-anchor="middle"
        font-family="'Jost', 'Helvetica Neue', Arial, sans-serif" font-size="17"
        letter-spacing="9" fill="url(#gold)">PORTFOLIO</text>
</svg>
